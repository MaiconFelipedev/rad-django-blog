<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>{% block titulo %}Blog IFPB{% endblock %}</title>
    <style>
        :root {
            color-scheme: light;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
            line-height: 1.6;
            color: #1f2937;
            background: #f3f4f6;
        }
        body { margin: 0; }
        header, footer { background: #064e3b; color: white; padding: 1rem; }
        header a, footer a { color: white; }
        main { width: min(860px, calc(100% - 2rem)); margin: 2rem auto; }
        .card { background: white; border: 1px solid #d1d5db; border-radius: .6rem; margin: 1rem 0; padding: 1rem 1.25rem; }
        .capa { border-radius: .45rem; display: block; height: auto; margin-bottom: 1rem; max-height: 320px; object-fit: cover; width: 100%; }
        .meta { color: #4b5563; font-size: .95rem; }
        .paginacao { align-items: center; display: flex; gap: 1rem; justify-content: center; margin: 2rem 0; }
        .relacionados { margin-top: 2.5rem; }
        .categorias { display: flex; flex-wrap: wrap; gap: .75rem; list-style: none; padding: 0; }
        a { color: #047857; }
    </style>
</head>
<body>
    <header>
        <h1><a href="{% url 'artigos:lista' %}">Blog IFPB</a></h1>
    </header>
    <main>
        {% block conteudo %}{% endblock %}
    </main>
    <footer>
        <p>IFPB — {% now "Y" %}</p>
        <nav aria-label="Categorias do blog">
            <strong>Categorias:</strong>
            <ul class="categorias">
                {% for item in categorias_disponiveis %}
                    <li>
                        <a href="{% url 'artigos:por_categoria' item.slug %}">
                            {{ item.nome }}
                        </a>
                    </li>
                {% empty %}
                    <li>Nenhuma categoria cadastrada.</li>
                {% endfor %}
            </ul>
        </nav>
    </footer>
</body>
</html>
